server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    # Flyway creates the tables; Hibernate only checks that the entities match them
    hibernate:
      ddl-auto: validate
    # Database work happens only inside the service layer, never while writing the HTTP response
    open-in-view: false
  jackson:
    generator:
      # 380 instead of 3.8E+2 for BigDecimal amounts
      write-bigdecimal-as-plain: true

# Node backend: source of cart contents and prices (internal API, shared secret)
node:
  base-url: ${NODE_BASE_URL:http://localhost:4000}
  internal-key: ${INTERNAL_API_KEY:}
  connect-timeout: 2s
  read-timeout: 3s

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
