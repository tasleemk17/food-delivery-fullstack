server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    # Flyway creates the tables; Hibernate only checks that the entities match them
    hibernate:
      ddl-auto: validate
    # Database work happens only inside the service layer, never while writing the HTTP response
    open-in-view: false
  jackson:
    generator:
      # 380 instead of 3.8E+2 for BigDecimal amounts
      write-bigdecimal-as-plain: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Wait for the broker to confirm, and never create duplicates when a send is retried
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast when the broker is down: the event just stays in the outbox
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

# Node backend: source of cart contents and prices (internal API, shared secret)
node:
  base-url: ${NODE_BASE_URL:http://localhost:4000}
  internal-key: ${INTERNAL_API_KEY:}
  connect-timeout: 2s
  read-timeout: 3s

# inventory-service: holds stock for an order until it is paid (internal API, shared secret)
inventory:
  base-url: ${INVENTORY_BASE_URL:http://localhost:8082}
  internal-key: ${INTERNAL_API_KEY:}
  connect-timeout: 2s
  read-timeout: 3s

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

# Order events go to Kafka through the outbox table (see OutboxPublisher)
outbox:
  topic: order-events
  poll-interval-ms: 1000
  batch-size: 50
  send-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health
