name: CI

# Runs on every pull request and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Node.js tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The tests mock the database, so no MongoDB or .env file is needed.
      - run: npm test

  gateway:
    name: Gateway (Maven tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -B test

  order-service:
    name: order-service (Maven tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # Some tests start PostgreSQL with Testcontainers; Docker is available on this runner.
      - run: mvn -B test

  inventory-service:
    name: inventory-service (Maven tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # Some tests start PostgreSQL with Testcontainers; Docker is available on this runner.
      - run: mvn -B test

  notification-service:
    name: notification-service (Maven tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # Some tests start PostgreSQL and Kafka with Testcontainers; Docker is available on this runner.
      - run: mvn -B test

  ai-service:
    name: ai-service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # The tests start PostgreSQL with Testcontainers; Docker is available on this runner.
      # Claude is never called: the tests use a stand-in, so no API key is needed.
      - run: python -m pytest -q

  frontends:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [smallapp, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
