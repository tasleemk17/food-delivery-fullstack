# Node backend, API gateway, order-service, inventory-service, notification-service, Kafka, MailHog, their PostgreSQL databases and the two React apps.
# Start:  docker compose up -d --build
# Stop:   docker compose down          (add -v to also delete the PostgreSQL data)
#
# MongoDB stays on Atlas.
# Customer app: http://localhost:5173   Admin panel: http://localhost:5174
# Both call the gateway on port 8090.
#
# For hot reload while editing the React code, stop the containers first
# (`docker compose stop smallapp admin`) and use `npm run dev` in each folder.

services:
  backend:
    build: ./backend
    container_name: food-backend
    # Reads MONGODB_URI, JWT_SECRET, STRIPE_*, INTERNAL_API_KEY etc. from backend/.env
    env_file: ./backend/.env
    environment:
      PORT: "4000"
    ports:
      # Still published so the Stripe CLI can deliver webhooks directly.
      - "4000:4000"
    volumes:
      # Keep uploaded food images on the laptop, outside the container
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  gateway:
    build: ./gateway
    container_name: food-gateway
    # Needs JWT_SECRET (same secret the backend signs tokens with)
    env_file: ./backend/.env
    environment:
      # Inside Docker, services reach each other by service name, not localhost
      NODE_BACKEND_URL: http://backend:4000
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      FRONTEND_URL: http://localhost:5173
      ADMIN_URL: http://localhost:5174
    ports:
      # Laptop port 8090 (8080 is taken by Oracle) -> container port 8080
      - "8090:8080"
    depends_on:
      backend:
        condition: service_healthy
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
    mem_limit: 512m
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: food-postgres
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      # Local development password. Set ORDERS_DB_PASSWORD in a root .env file to change it.
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_local_pw}
    volumes:
      # Named volume: order data survives `docker compose down` (but not `down -v`)
      - orders-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No ports: only order-service talks to the database, over the Docker network
    restart: unless-stopped

  order-service:
    build: ./order-service
    container_name: food-order-service
    # STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, INTERNAL_API_KEY, FRONTEND_URL come from backend/.env
    env_file: ./backend/.env
    environment:
      NODE_BASE_URL: http://backend:4000
      INVENTORY_BASE_URL: http://inventory-service:8082
      # Order events go here. Orders still work if Kafka is down: events wait in the outbox table.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: orders
      DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_local_pw}
    # No ports: order-service trusts the X-User-Id header, so it must only be
    # reachable through the gateway, over the Docker network.
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_started
    mem_limit: 512m
    restart: unless-stopped

  # Each service has its own database, so neither can read or break the other's tables
  postgres-inventory:
    image: postgres:16-alpine
    container_name: food-postgres-inventory
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      # Local development password. Set INVENTORY_DB_PASSWORD in a root .env file to change it.
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_local_pw}
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No ports: only inventory-service talks to the database, over the Docker network
    restart: unless-stopped

  inventory-service:
    build: ./inventory-service
    container_name: food-inventory-service
    # INTERNAL_API_KEY (the key order-service sends in X-Internal-Key) comes from backend/.env
    env_file: ./backend/.env
    environment:
      DB_URL: jdbc:postgresql://postgres-inventory:5432/inventory
      DB_USER: inventory
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_local_pw}
      # It reads the order events: a paid order commits its stock, a failed payment gives it back
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # No ports: reached only through the gateway (/api/inventory) or by order-service
    depends_on:
      postgres-inventory:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  # Emails are not really delivered while developing: MailHog catches them in a test inbox.
  # Open http://localhost:8025 to read them. (SMTP, port 1025, is only reachable inside Docker.)
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: food-mailhog
    ports:
      - "127.0.0.1:8025:8025"
    mem_limit: 128m
    restart: unless-stopped

  postgres-notifications:
    image: postgres:16-alpine
    container_name: food-postgres-notifications
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      # Local development password. Set NOTIFICATIONS_DB_PASSWORD in a root .env file to change it.
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications_local_pw}
    volumes:
      - notifications-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No ports: only notification-service talks to the database, over the Docker network
    restart: unless-stopped

  # Listens to the order events on Kafka and emails the customer. Has no public API and no published port.
  notification-service:
    build: ./notification-service
    container_name: food-notification-service
    environment:
      DB_URL: jdbc:postgresql://postgres-notifications:5432/notifications
      DB_USER: notifications
      DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications_local_pw}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
    depends_on:
      postgres-notifications:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started
    mem_limit: 512m
    restart: unless-stopped

  # Message broker for order events (KRaft mode: no ZooKeeper needed).
  # Single node, so every replication factor is 1. Not published to the laptop:
  # only the other containers use it, at kafka:9092.
  kafka:
    image: apache/kafka:3.8.0
    container_name: food-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    restart: unless-stopped

  smallapp:
    build:
      context: ./smallapp
      args:
        # Address the BROWSER uses to reach the gateway (baked into the JavaScript)
        VITE_API_URL: http://localhost:8090
    container_name: food-smallapp
    ports:
      # Port 5173 is the one the backend and gateway allow (CORS) for the customer app
      - "5173:8080"
    depends_on:
      - gateway
    mem_limit: 128m
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: http://localhost:8090
    container_name: food-admin
    ports:
      # Port 5174 is the one the backend and gateway allow (CORS) for the admin panel
      - "5174:8080"
    depends_on:
      - gateway
    mem_limit: 128m
    restart: unless-stopped

volumes:
  orders-data:
  inventory-data:
  notifications-data:
  kafka-data:
