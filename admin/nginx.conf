server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # React Router handles the URLs in the browser. For any path that is not a
    # real file (for example /cart or /myorders after a refresh), send index.html.
    location / {
        try_files $uri /index.html;
    }

    # Built files have a hash in their name, so they can be cached for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache index.html, so a new build is picked up straight away
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
