server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      # Where each request goes. Order matters: the first matching route wins.
      routes:
        # Everything goes to the Node backend for now.
        - id: node-backend
          uri: ${NODE_BACKEND_URL:http://localhost:4000}
          predicates:
            - Path=/**

      # CORS must be handled here. The browser sends a "preflight" OPTIONS
      # request before most API calls, and the gateway answers it itself
      # instead of forwarding it to Node.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${FRONTEND_URL:http://localhost:5173}
              - ${ADMIN_URL:http://localhost:5174}
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: "*"

      # Node also adds CORS headers to its responses. Without this filter the
      # browser would receive the same header twice and reject the response.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Vary, RETAIN_UNIQUE

management:
  endpoints:
    web:
      exposure:
        include: health
